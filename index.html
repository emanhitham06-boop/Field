<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electrical Field</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#020223;--pill:#1A1A52;--pillOn:#7B7BC4;--inp:#10104A;--gold:#E3B26B;--coral:#FF7B5C;--ink:#E8E8FF;--mute:#8F8FC0;--line:#2A2A70;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.w{max-width:960px;margin:auto;padding:16px 18px 50px}
.hd{position:relative;display:flex;align-items:center;justify-content:center;min-height:64px;margin:4px 0 20px;padding:0 70px}
h1{font:700 clamp(1.9rem,6vw,3.2rem) 'Playfair Display',Georgia,serif;color:var(--gold);text-align:center;margin:0}
.logo{position:absolute;right:0;top:50%;transform:translateY(-50%);width:clamp(44px,9vw,64px);height:auto}
button{font-family:'Playfair Display',Georgia,serif}
nav{display:flex;justify-content:center;gap:18px;margin-bottom:26px}
nav button{font-size:1.05rem;font-weight:700;color:var(--ink);background:var(--pill);border:0;border-radius:12px;padding:8px 26px;cursor:pointer}
nav button.on{background:var(--pillOn);color:#10104A}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.prow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
input,select{width:88px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);font-size:1rem;padding:0 8px;text-align:center}
select{width:auto;padding:0 12px;text-align:left}
input.nm{width:84px;font:700 1.05rem 'Playfair Display',serif;color:var(--gold);background:transparent;border-style:dashed}
.sq{width:44px;height:42px;border:0;border-radius:12px;background:var(--pillOn);color:#10104A;font-size:1.35rem;font-weight:700;cursor:pointer}
.sq.x{background:#3a2a60;color:#fff}
.calc{display:block;margin:16px 0 0 auto;font-size:1.25rem;font-weight:700;background:var(--coral);color:#2a1020;border:0;border-radius:14px;padding:14px 34px;cursor:pointer}
.msg{color:#FF9C9C;min-height:1.4em;margin-top:8px}
#res{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:26px 0 10px}
.bar .sp{flex:1}
.bar button,.ops button{font-size:1rem;font-weight:700;background:var(--pill);color:var(--ink);border:0;border-radius:12px;padding:7px 16px;cursor:pointer}
.bar button.on,.ops button.on{background:var(--pillOn);color:#10104A}
.bar .sys.on{color:#06061c}
#note{position:absolute;left:14px;top:10px;z-index:2;font-size:.78rem;color:var(--mute);max-width:62%;pointer-events:none}#pinlist{position:absolute;left:14px;top:64px;z-index:2;font:700 .95rem system-ui,sans-serif;line-height:1.6;pointer-events:none;max-height:70%;overflow:hidden}
#note button{pointer-events:auto;font-size:.75rem;background:#3B82F6;color:#fff;border:0;border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:6px}
#box{position:relative;border:1px solid var(--line);border-radius:14px;padding:6px;background:#04042e}
canvas{display:block;width:100%;touch-action:none}
#c3{height:min(78vw,480px);cursor:grab}
#two{display:none;gap:6px}#two canvas{aspect-ratio:1}
.cap{font-size:.8rem;color:var(--mute);text-align:center;margin:2px}
.chips,.ops{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.lab{font:700 1rem 'Playfair Display',serif}
.chip{font-weight:700;background:var(--inp);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:5px 14px;cursor:pointer}
.chip.act{border-color:var(--gold)}.chip.pk{border-color:#FF5C5C;background:#3a1030}.chip.sl{border-color:#FF6B6B;background:#3a1030}
.dist{background:#FF5C5C!important;color:#2a1020!important;border:0;border-radius:12px;padding:7px 18px;font-weight:700;cursor:pointer}
.ask{color:var(--gold);min-height:1.5em;font-weight:600;margin:4px 0}
.card{background:#0A0A3A;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;line-height:1.8;overflow-x:auto}
.card h3{margin:0 0 4px;font:700 1.15rem 'Playfair Display',serif;color:var(--gold)}
.card .a{color:#5DA9FF}.card .b{color:#4FE3A1}.card .c{color:#FFB35C}.card small{color:var(--mute);display:block}
</style>
</head>

<div id="res">
<div class="bar">

<button class="sys" data-s="cyl">Cylindrical</button>

</div>

</div>

</div>

<script>
const $=s=>document.querySelector(s),D=Math.PI/180;
const f=v=>String(+(Math.abs(v)<1e-10?0:v).toFixed(4));
const SYS={car:{c:'#5DA9FF'},cyl:{c:'#4FE3A1'},sph:{c:'#FFB35C'}};
const PH={car:['x','y','z'],cyl:['ρ','φ°','z'],sph:['r','θ°','φ°']};
const VC=['#F2F2FF','#FFD36B','#7FE0FF','#FF9CD0','#B6FF8A'];
const S={p:{max:10,pre:n=>'P'+n,list:[],act:0,extra:[],dist:{step:0},cnt:0},
 v:{max:5,pre:n=>String.fromCharCode(64+n),list:[],act:0,extra:[],opSel:[],op:null,mop:'dot',card:'',cnt:0}};
S.p.pins=new Map();S.v.pins=new Map();
let cur='p',sel='car',mode='3d',yaw=-.6,pit=.5,al={car:1,cyl:.28,sph:.28},hit=[],tg=[];
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],mag=a=>Math.hypot(...a);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vt=a=>'('+a.map(f).join(', ')+')';

/* ---------- conversion ---------- */
function conv(v,s){let x,y,z;
 if(s==='car')[x,y,z]=v;
 else if(s==='cyl'){x=v[0]*Math.cos(v[1]*D);y=v[0]*Math.sin(v[1]*D);z=v[2]}
 else{const t=v[1]*D,p=v[2]*D;x=v[0]*Math.sin(t)*Math.cos(p);y=v[0]*Math.sin(t)*Math.sin(p);z=v[0]*Math.cos(t)}
 [x,y,z]=[x,y,z].map(a=>Math.abs(a)<1e-10?0:a);
 const rho=Math.hypot(x,y),r=Math.hypot(rho,z);let phi=Math.atan2(y,x);if(phi<0)phi+=2*Math.PI;if(!rho)phi=0;
 return{x,y,z,rho,r,phi,th:r?Math.acos(Math.max(-1,Math.min(1,z/r))):0,q:[x,y,z]}}

/* ---------- input blocks ---------- */
function buildIn(k){const R=$('#in-'+k),s=S[k];
 R.innerHTML=`<div class="prow"><select class="is" aria-label="Input system"><option value="car">Input: Cartesian (x, y, z)</option><option value="cyl">Input: Cylindrical (ρ, φ°, z)</option><option value="sph">Input: Spherical (r, θ°, φ°)</option></select></div><div class="rows"></div><button class="calc">Calculate</button><div class="msg" role="alert"></div>`;
 s.rows=R.querySelector('.rows');s.sys=R.querySelector('.is');s.err=R.querySelector('.msg');
 s.sys.onchange=()=>ph(k);R.querySelector('.calc').onclick=()=>calc(k)}
function ph(k){const p=PH[S[k].sys.value];S[k].rows.querySelectorAll('input:not(.nm)').forEach((e,i)=>e.placeholder=p[i%3])}
function addRow(k,v=['','','']){const s=S[k];
 if(s.rows.children.length>=s.max){s.err.textContent='Maximum is '+s.max+(k==='p'?' points.':' vectors.');return}
 s.err.textContent='';const n=++s.cnt,d=document.createElement('div');d.className='prow';
 d.innerHTML=`<input class="nm" value="${s.pre(n)}" aria-label="Name"> `+[0,1,2].map(i=>`<input type="number" step="any" inputmode="decimal" value="${v[i]}" aria-label="Value ${i+1}">`).join('')+'<button class="sq pl" aria-label="Add">+</button><button class="sq x" aria-label="Remove">×</button>';
 d.querySelector('.pl').onclick=()=>addRow(k);
 d.querySelector('.x').onclick=()=>{if(s.rows.children.length>1)d.remove();else d.querySelectorAll('input:not(.nm)').forEach(i=>i.value='')};
 s.rows.append(d);ph(k)}
function calc(k){const s=S[k],out=[];
 for(const r of s.rows.children){const v=[...r.querySelectorAll('input:not(.nm)')].map(i=>parseFloat(i.value)),nm=r.querySelector('.nm').value.trim()||s.pre(out.length+1);
  if(v.some(isNaN)){s.err.textContent='Please fill all three values of '+nm+'.';return}
  out.push({...conv(v,s.sys.value),name:nm})}
 s.err.textContent='';s.list=out;s.act=out.length-1;s.extra=[];s.card='';s.pins=new Map();
 if(k==='p')s.dist={step:0};else{s.opSel=[];s.op=null}
 if(k===cur)show();}
function show(){$('#res').style.display=S[cur].list.length?'block':'none';$('#ptCtl').style.display=cur==='p'?'block':'none';$('#vcCtl').style.display=cur==='v'?'block':'none';ui();anim()}

/* ---------- construction lines ---------- */
function scene(P,s){const{x,y,z,rho,r,phi,th,q}=P,O=[0,0,0],B=[x,y,0],I=[];
 const mid=(a,b)=>a.map((v,i)=>(v+b[i])/2);
 const ln=(a,b,n,v,d)=>I.push({p:[a,b],n,v,d,at:mid(a,b)});
 const arc=(R,a1,fn,n,v)=>{const p=[];for(let i=0;i<=40;i++)p.push(fn(R,a1*i/40));I.push({p,n,v,at:fn(R*1.45,a1/2)})};
 const flat=(R,t)=>[R*Math.cos(t),R*Math.sin(t),0];
 const full=fn=>{const p=[];for(let i=0;i<=72;i++)p.push(fn(i*Math.PI/36));I.push({p,s:1})};
 const U=Math.max(.8,(r||1)*.28),ar=(w,n)=>I.push({p:[q,q.map((c,i)=>c+w[i]*U)],n,v:vt(w),ar:1}),cp=Math.cos(phi),sp=Math.sin(phi),dg=a=>f(a/D)+'°';
 if(s==='car'){const A=[x,0,0];ln(O,A,'x',f(x));ln(A,B,'y',f(y));ln(B,q,'z',f(z));ar([1,0,0],'a_x');ar([0,1,0],'a_y');ar([0,0,1],'a_z')}
 if(s==='cyl'){if(rho){ln(O,B,'ρ',f(rho));arc(rho*.35,phi,flat,'φ',dg(phi));
   full(t=>[rho*Math.cos(t),rho*Math.sin(t),0]);full(t=>[rho*Math.cos(t),rho*Math.sin(t),z]);
   for(let j=0;j<4;j++){const a=phi+j*Math.PI/2;I.push({p:[[rho*Math.cos(a),rho*Math.sin(a),0],[rho*Math.cos(a),rho*Math.sin(a),z]],s:1})}}
  ln(B,q,'z',f(z));ar([cp,sp,0],'a_ρ');ar([-sp,cp,0],'a_φ');ar([0,0,1],'a_z')}
 if(s==='sph'&&r){ln(O,q,'r',f(r));ln(O,B,'','',1);ln(B,q,'','',1);
  arc(r*.3,th,(R,t)=>[R*Math.sin(t)*cp,R*Math.sin(t)*sp,R*Math.cos(t)],'θ',dg(th));
  if(rho){arc(rho*.55,phi,flat,'φ',dg(phi));full(t=>[rho*Math.cos(t),rho*Math.sin(t),z])}
  full(t=>[r*Math.cos(t),r*Math.sin(t),0]);full(t=>[r*Math.sin(t)*cp,r*Math.sin(t)*sp,r*Math.cos(t)]);
  ar([Math.sin(th)*cp,Math.sin(th)*sp,Math.cos(th)],'a_r');ar([Math.cos(th)*cp,Math.cos(th)*sp,-Math.sin(th)],'a_θ');ar([-sp,cp,0],'a_φ')}
 return I}

/* ---------- drawing ---------- */
function view(cv,proj,L,gp,axes,skip,only){
 const s=S[cur],ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 const k_=Math.min(w,h)/(2.6*L),sc=p=>{const a=proj(p);return[w/2+a[0]*k_,h/2-a[1]*k_]},st=L<=6?1:Math.ceil(L/6),O=[0,0,0];
 const seg=(a,b,col,wd,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(...sc(a));ctx.lineTo(...sc(b));ctx.stroke()};
 const arw=(a,b,col,wd,dash)=>{seg(a,b,col,wd,dash);const A=sc(a),B=sc(b);if(Math.hypot(B[0]-A[0],B[1]-A[1])<4){ctx.setLineDash([]);ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(B[0],B[1],6,0,7);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(B[0],B[1],2,0,7);ctx.fill();return}const t=Math.atan2(B[1]-A[1],B[0]-A[0]);
  ctx.setLineDash([]);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(...B);ctx.lineTo(B[0]-11*Math.cos(t-.4),B[1]-11*Math.sin(t-.4));ctx.lineTo(B[0]-11*Math.cos(t+.4),B[1]-11*Math.sin(t+.4));ctx.fill()};
 for(let i=-L;i<=L;i+=st){seg(gp(i,-L),gp(i,L),'rgba(150,150,255,.09)',1);seg(gp(-L,i),gp(L,i),'rgba(150,150,255,.09)',1)}
 ctx.font='12px system-ui';
 for(const a of axes){const e=k=>a.d.map(v=>v*k);seg(e(-L),e(0),'rgba(200,200,255,.3)',1,[4,4]);seg(e(0),e(L),'rgba(220,220,255,.7)',1.5);
  ctx.fillStyle='#C8C8FF';ctx.font='700 14px "Playfair Display",serif';ctx.fillText(a.t,...sc(e(L*1.1)))}
 const P=s.list[s.act];
 for(const k of ['car','cyl','sph']){if(al[k]<=.01)continue;ctx.globalAlpha=al[k];
  for(const it of scene(P,k)){ctx.globalAlpha=al[k]*(it.s?.35:it.ar?.35:1);
   const key=P.name+'|'+k+'|'+it.n,pin=it.n&&s.pins.has(key);
   if(it.ar)arw(it.p[0],it.p[1],SYS[k].c,k===sel?2.4:1.5);
   else{ctx.strokeStyle=SYS[k].c;ctx.lineWidth=it.s?.9:k===sel?2.4:1.2;ctx.setLineDash(it.d?[5,4]:[]);ctx.beginPath();
    it.p.forEach((p,i)=>{const c=sc(p);i?ctx.lineTo(...c):ctx.moveTo(...c)});ctx.stroke()}
   if(it.n){ctx.globalAlpha=pin?1:al[k];ctx.fillStyle=SYS[k].c;ctx.font='700 14px "Playfair Display",serif';ctx.fillText(it.n,...sc(it.ar?it.p[1]:it.at).map(v=>v+5));
    if(!only&&k===sel)tg.push({key,pts:it.p.map(sc),n:it.n,v:it.v,c:SYS[k].c})}}}
 ctx.globalAlpha=1;ctx.setLineDash([]);
 if(!only)for(const e of s.extra){e.arrow?arw(e.a,e.b,e.col,2.4,e.dash?[5,4]:null):seg(e.a,e.b,e.col,2.4,e.dash?[5,4]:null);
  if(e.n){const key='ex|'+e.n,pin=s.pins.has(key);ctx.fillStyle=e.col;ctx.font='700 14px system-ui';ctx.fillText(e.n,...sc(e.a.map((v,i)=>(v+e.b[i])/2)).map(v=>v+8));tg.push({key,pts:[sc(e.a),sc(e.b)],n:e.n,v:e.v,c:e.col})}}
 const pos=s.list.map(p=>sc(p.q));
 s.list.forEach((p,i)=>{if(only&&i!==s.act)return;const[a,b]=pos[i];
  if(cur==='v'){arw(O,p.q,VC[i%5],i===s.act?3:2);ctx.fillStyle=VC[i%5];ctx.font='700 14px system-ui';ctx.fillText(p.name,a+8,b-8);return}
  ctx.beginPath();ctx.arc(a,b,i===s.act?7:5,0,7);ctx.fillStyle=i===s.act?'#E3B26B':'#fff';ctx.fill();
  if(s.dist.step>0&&(i===s.dist.a||i===s.dist.b)){ctx.strokeStyle='#FF5C5C';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a,b,12,0,7);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText(p.name,a+9,b+16)});
 return pos}

function render(){const s=S[cur];if(!s.list.length)return;tg=[];$('#clr').style.display=s.pins.size?'inline':'none';$('#pinlist').innerHTML=[...s.pins.values()].map(p=>`<div style="color:${p.c}">${p.n} = ${p.v}</div>`).join('');
 const all=[...s.list.map(p=>p.q),...s.list.map(p=>[p.r]),...s.extra.flatMap(e=>[e.a,e.b])];
 const L=Math.max(2,Math.ceil(Math.max(...all.flatMap(q=>q.map(Math.abs)))*1.15)),G=(a,b)=>[a,b,0];
 if(mode==='3d'){const c=Math.cos(yaw),sn=Math.sin(yaw);
  hit=view($('#c3'),p=>{const x1=p[0]*c-p[1]*sn,y1=p[0]*sn+p[1]*c;return[x1,p[2]*Math.cos(pit)+y1*Math.sin(pit)]},L,G,[{d:[1,0,0],t:'x'},{d:[0,1,0],t:'y'},{d:[0,0,1],t:'z'}])}
 else{hit=view($('#c2a'),p=>[p[0],p[1]],L,G,[{d:[1,0,0],t:'x'},{d:[0,1,0],t:'y'}],null);
  const u=[Math.cos(s.list[s.act].phi),Math.sin(s.list[s.act].phi)];
  view($('#c2b'),p=>[p[0]*u[0]+p[1]*u[1],p[2]],L,(a,b)=>[u[0]*a,u[1]*a,b],[{d:[u[0],u[1],0],t:'ρ'},{d:[0,0,1],t:'z'}],null,1)}}
function anim(){let go=false;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 for(const k in al){const t=k===sel?1:.28;al[k]=rm?t:al[k]+(t-al[k])*.25;if(Math.abs(t-al[k])>.01)go=true;else al[k]=t}
 render();if(go)requestAnimationFrame(anim)}

/* ---------- controls ---------- */
document.querySelectorAll('.sys').forEach(b=>b.onclick=()=>{sel=b.dataset.s;document.querySelectorAll('.sys').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.style.background=on?SYS[x.dataset.s].c:''});anim()});
function setMode(m){mode=m;$('#c3').style.display=m==='3d'?'block':'none';$('#two').style.display=m==='2d'?'flex':'none';$('#two').querySelectorAll('div').forEach(d=>d.style.flex='1');
 $('#m3').classList.toggle('on',m==='3d');$('#m2').classList.toggle('on',m==='2d');$('#hint').textContent=m==='3d'?'Drag the 3D plot to rotate it.':'Tap a tip to select it.';render()}
$('#m3').onclick=()=>setMode('3d');$('#m2').onclick=()=>setMode('2d');
function page(k){cur=k;$('#in-p').style.display=k==='p'?'block':'none';$('#in-v').style.display=k==='v'?'block':'none';
 $('#nP').classList.toggle('on',k==='p');$('#nV').classList.toggle('on',k==='v');show();setMode(mode)}
$('#nP').onclick=()=>page('p');$('#nV').onclick=()=>page('v');

/* points: distance */
function pick(i){const s=S.p,d=s.dist;
 if(d.step===1){d.a=i;d.step=2}
 else if(d.step===2){if(i===d.a){ui('Choose a different point.');return}d.b=i;d.step=3;
  const A=s.list[d.a].q,B=s.list[d.b].q;d.d=mag(sub(B,A));s.extra=[{a:A,b:B,col:'#FF5C5C',n:'d',v:f(d.d),arrow:1}]}
 else s.act=i;
 ui();render()}
$('#dist').onclick=()=>{const s=S.p;if(s.list.length<2){$('#ask').textContent='Add a second point first (use + above, then Calculate).';return}s.dist={step:1};s.extra=[];ui();render()};

/* vectors: operations */
function vtoggle(i){const s=S.v,j=s.opSel.indexOf(i);
 if(j>=0)s.opSel.splice(j,1);else{s.opSel.push(i);s.act=i}
 runOp();ui();render()}
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const s=S.v;s.op=s.op===b.dataset.op?null:b.dataset.op;runOp();ui();render()});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.v.mop=b.dataset.m;runOp();ui();render()});
$('#kk').oninput=()=>{runOp();ui();render()};
function runOp(){const s=S.v,V=s.opSel.map(i=>s.list[i]),O=[0,0,0];s.extra=[];s.card='';s.msg='';
 if(!s.op){s.msg='Pick an operation, then tap the vectors you want to use.';return}
 const card=(t,body,col)=>`<div class="card" style="border-color:${col}"><h3>${t}</h3>${body}</div>`;
 const blk=(R)=>{const c=conv(R,'car'),m=mag(R);return `<span class="a">Cartesian (x, y, z) = ${vt(R)}</span><br><span class="b">Cylindrical (ρ, φ, z) = (${f(c.rho)}, ${f(c.phi/D)}°, ${f(c.z)})</span><br><span class="c">Spherical (r, θ, φ) = (${f(c.r)}, ${f(c.th/D)}°, ${f(c.phi/D)}°)</span><small>|R| = ${f(m)}${m?' , unit vector = '+vt(R.map(v=>v/m)):''}</small>`};
 if(s.op==='add'||s.op==='sub'){const ad=s.op==='add';
  if(V.length<2){s.msg='Tap at least two vectors to '+(ad?'add':'subtract')+' them.';return}
  let c=V[0].q.slice();
  for(let i=1;i<V.length;i++){const w=V[i].q.map(v=>ad?v:-v),n=c.map((v,k)=>v+w[k]);s.extra.push({a:c,b:n,col:'#9AA0FF',dash:1,arrow:1,n:(ad?'':'−')+V[i].name,v:vt(w)});c=n}
  s.extra.push({a:O,b:c,col:'#FF6B6B',arrow:1,n:'R',v:vt(c)});
  const ex=V.map((v,i)=>i?(ad?' + ':' − ')+v.name:v.name).join(''),jn=ad?' + ':' − ';
  s.card=card('R = '+ex,['x','y','z'].map((a,k)=>`R${a} = ${V.map(v=>f(v.q[k])).join(jn)} = ${f(c[k])}`).join('<br>')+'<br>'+blk(c),'#FF6B6B');return}
 if(s.mop==='scl'){if(!V.length){s.msg='Tap one vector to multiply by k.';return}
  const k=parseFloat($('#kk').value);if(isNaN(k)){s.msg='Enter a number for k.';return}
  const A=V[0],R=A.q.map(v=>v*k);s.extra.push({a:O,b:R,col:'#FF6B6B',arrow:1,n:'k·'+A.name,v:vt(R)});
  s.card=card(`R = ${f(k)} · ${A.name}`,`R = (${A.q.map(v=>f(k)+'·'+f(v)).join(', ')})<br>`+blk(R),'#FF6B6B');return}
 if(V.length<2){s.msg='Tap two vectors (the first two you tap are used).';return}
 const A=V[0],B=V[1],a=A.q,b=B.q;
 if(s.mop==='dot'){const d=dot(a,b),ma=mag(a),mb=mag(b),th=ma&&mb?Math.acos(Math.max(-1,Math.min(1,d/(ma*mb))))/D:0;
  if(mb)s.extra.push({a:O,b:b.map(v=>v*d/(mb*mb)),col:'#FFD36B',dash:1,n:'projection',v:f(d/mb)});
  s.card=card(`${A.name} · ${B.name}`,`${A.name}·${B.name} = ${a.map((v,i)=>`(${f(v)})(${f(b[i])})`).join(' + ')} = <b>${f(d)}</b><br>Angle θ = cos⁻¹(A·B / |A||B|) = ${f(th)}°<br>Projection of ${A.name} on ${B.name} = ${mb?f(d/mb):0}<small>Result is a scalar.${d===0?' The vectors are perpendicular.':''}</small>`,'#FFD36B');return}
 const c=cross(a,b);s.extra.push({a:O,b:c,col:'#C58BFF',arrow:1,n:A.name+'×'+B.name,v:vt(c)});
 s.card=card(`${A.name} × ${B.name}`,`x: (${f(a[1])})(${f(b[2])}) − (${f(a[2])})(${f(b[1])}) = ${f(c[0])}<br>y: (${f(a[2])})(${f(b[0])}) − (${f(a[0])})(${f(b[2])}) = ${f(c[1])}<br>z: (${f(a[0])})(${f(b[1])}) − (${f(a[1])})(${f(b[0])}) = ${f(c[2])}<br>`+blk(c)+`<small>|A×B| = parallelogram area = ${f(mag(c))}</small>`,'#C58BFF')}

/* ---------- UI refresh ---------- */
function ui(note){const s=S[cur];if(!s.list.length)return;const c=[];
 if(cur==='p'){const d=s.dist;
  $('#chips').innerHTML='';s.list.forEach((p,i)=>{const b=document.createElement('button');b.className='chip'+(i===s.act?' act':'')+((d.step>0&&(i===d.a||i===d.b))?' pk':'');b.textContent=p.name;b.onclick=()=>pick(i);$('#chips').append(b)});
  $('#ask').textContent=note||(d.step===1?'please choose first point':d.step===2?'please choose next point':$('#ask').dataset.keep||'');
  if(d.step===3){const A=s.list[d.a],B=s.list[d.b],r=sub(B.q,A.q),m=d.d;
   c.push(`<div class="card" style="border-color:#FF5C5C"><h3>Distance: ${A.name} → ${B.name}</h3>Displacement R = ${B.name} − ${A.name} = ${vt(r)} = ${f(r[0])}aₓ + ${f(r[1])}aᵧ + ${f(r[2])}a_z<br>Distance |R| = √(${r.map(v=>f(v)+'²').join(' + ')}) = <b>${f(m)}</b>${m?`<small>Unit vector a = R/|R| = ${vt(r.map(v=>v/m))}</small>`:''}</div>`)}}
 else{$('#vch').innerHTML='';s.list.forEach((p,i)=>{const j=s.opSel.indexOf(i),b=document.createElement('button');b.className='chip'+(j>=0?' sl':'')+(i===s.act?' act':'');b.innerHTML=p.name+(j>=0?'<sup> '+(j+1)+'</sup>':'');b.onclick=()=>vtoggle(i);$('#vch').append(b)});
  document.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('on',b.dataset.op===s.op));
  $('#mulOps').style.display=s.op==='mul'?'flex':'none';document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===s.mop));
  $('#kk').style.display=s.mop==='scl'?'block':'none';$('#ask').textContent=note||s.msg||'';
  if(s.card)c.push(s.card)}
 s.list.forEach(p=>{const{x,y,z,rho,r,phi,th}=p;
  c.push(`<div class="card"><h3>${p.name}${cur==='v'?` &nbsp;<span style="font-size:.9rem;color:#8F8FC0">|${p.name}| = ${f(r)}</span>`:''}</h3>
  <span class="a">Cartesian (x, y, z) = (${f(x)}, ${f(y)}, ${f(z)})</span><br><span class="b">Cylindrical (ρ, φ, z) = (${f(rho)}, ${f(phi/D)}°, ${f(z)})</span><br><span class="c">Spherical (r, θ, φ) = (${f(r)}, ${f(th/D)}°, ${f(phi/D)}°)</span>
  <small>ρ = √(x²+y²) = ${f(rho)} &nbsp;|&nbsp; φ = tan⁻¹(y/x) = ${f(phi/D)}° &nbsp;|&nbsp; r = √(x²+y²+z²) = ${f(r)} &nbsp;|&nbsp; θ = cos⁻¹(z/r) = ${f(th/D)}°</small></div>`)});
 $('#cards').innerHTML=c.join('')}

/* canvas: rotate + tap */
function bind(cv,rot){let dn=null;
 cv.onpointerdown=e=>{dn={x:e.clientX,y:e.clientY,yaw,pit,m:false};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>4)dn.m=true;
  if(rot&&dn.m){yaw=dn.yaw+dx*.01;pit=Math.max(-1.5,Math.min(1.5,dn.pit+dy*.01));render()}};
 cv.onpointerup=e=>{if(dn&&!dn.m){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=-1,bd=24;
  hit.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;b=i}});if(b>=0){cur==='p'?pick(b):vtoggle(b)}else{let best=null,m=10;for(const t of tg)for(let i=0;i<t.pts.length-1;i++){const d=sd(x,y,t.pts[i],t.pts[i+1]);if(d<m){m=d;best=t}}if(best){S[cur].pins.set(best.key,best);render()}}}dn=null}}
const sd=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)};
$('#clr').onclick=()=>{S[cur].pins.clear();render()};
bind($('#c3'),true);bind($('#c2a'),false);addEventListener('resize',render);

/* start with sample data */
buildIn('p');buildIn('v');
addRow('p');addRow('v');setMode('3d');
</script>
</body>
